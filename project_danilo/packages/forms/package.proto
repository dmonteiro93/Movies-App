syntax = "proto2";

message User {
    required string login = 1;
    required string password = 2;
}

message Movie {
   required string id = 1;
   required string title = 2;
   optional string genre = 3;
   required double price = 4;
}

message Rental {
   required string id = 1;
   required string user_login = 2;
   required string movie_id = 3;
   optional string rental_date = 4;
   optional string return_date = 5;
}

message LoginRequest {
   required string login = 1;
   required string senha = 2;
}

message LoginResponse {
   required bool success = 1;
   required string message = 2;
}

message MovieRequest {
   required string id = 1;
}
message RentalRequest {
   required string user_login = 1;
   required string movie_id = 2;
}